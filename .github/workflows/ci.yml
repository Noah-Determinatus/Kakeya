- name: Give execution permissions to scripts
  run: chmod +x scripts/*.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lean
        uses: leanprover/lean-action@v1

      - name: Build 3D
        run: lake build Kakeya3D

      - name: Build 4D
        run: lake build Kakeya4D

      - name: Check no sorry
        run: scripts/check_no_sorry.sh

      - name: Audit axioms
        run: scripts/audit_axioms.sh